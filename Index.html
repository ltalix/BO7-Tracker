<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BO7 Stats Tracker</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- PWA manifest and favicon -->
    <link rel="manifest" href="manifest.json">
    <link rel="icon" href="data:,">
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            max-width: 900px;
            margin: 0 auto;
            padding: 16px;
            background: #121212;
            color: #e0e0e0;
        }
        h1, h2 {
            text-align: center;
            color: #bb86fc;
        }
        .tabs {
            display: flex;
            justify-content: center;
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 10px;
        }
        .tab-btn {
            padding: 12px 20px;
            background: #2d2d2d;
            border: none;
            border-radius: 8px;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }
        .tab-btn.active {
            background: #bb86fc;
            color: black;
            font-weight: bold;
        }
        .tab-content {
            display: none;
        }
        .tab-content.active {
            display: block;
        }
        .card {
            background: #1e1e1e;
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 20px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.3);
        }
        input, button, select {
            padding: 12px;
            margin: 6px 0;
            border-radius: 8px;
            border: none;
            font-size: 16px;
            background: #2d2d2d;
            color: white;
            width: 100%;
            box-sizing: border-box;
        }
        button {
            background: #bb86fc;
            color: black;
            font-weight: bold;
            cursor: pointer;
            width: auto;
            display: inline-block;
            padding: 12px 24px;
        }
        .quick-buttons {
            display: flex;
            justify-content: center;
            gap: 12px;
            flex-wrap: wrap;
            margin: 16px 0;
        }
        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }
        .custom-add {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        .custom-row {
            display: flex;
            gap: 8px;
            align-items: center;
        }
        .custom-row input {
            flex: 1;
            margin: 0;
        }
        .custom-row button {
            width: auto;
            white-space: nowrap;
        }
        .counts {
            font-size: 14px;
            color: #aaa;
            text-align: center;
            margin: 10px 0;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }
        th, td {
            padding: 10px;
            text-align: center;
            border-bottom: 1px solid #333;
        }
        th {
            background: #2d2d2d;
            font-size: 14px;
        }
        .delete-btn {
            background: none;
            color: #cf6679;
            padding: 4px 8px;
            font-size: 14px;
        }
        .summary {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
            gap: 12px;
            text-align: center;
            margin: 20px 0;
        }
        .stat-box {
            background: #2d2d2d;
            padding: 12px;
            border-radius: 10px;
        }
        .stat-value {
            font-size: 24px;
            font-weight: bold;
            color: #bb86fc;
        }
        .stat-label {
            font-size: 14px;
            color: #aaa;
        }
        canvas {
            background: #1e1e1e;
            border-radius: 8px;
            padding: 10px;
            margin: 10px 0;
        }
        @media (max-width: 600px) {
            .form-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <h1>Black Ops 7 Stats Tracker</h1>

    <div class="tabs">
        <button class="tab-btn active" onclick="openTab('add')">Add Match</button>
        <button class="tab-btn" onclick="openTab('matches')">Matches</button>
        <button class="tab-btn" onclick="openTab('charts')">Charts</button>
    </div>

    <div id="add" class="tab-content active">
        <div class="card">
            <h2>Manage Options</h2>
            <div class="custom-add">
                <div class="custom-row">
                    <input type="text" id="newWeapon" placeholder="New weapon name">
                    <button onclick="addCustom('weapon')">+ Weapon</button>
                </div>
                <div class="custom-row">
                    <input type="text" id="newMap" placeholder="New map name">
                    <button onclick="addCustom('map')">+ Map</button>
                </div>
                <div class="custom-row">
                    <input type="text" id="newMode" placeholder="New mode name">
                    <button onclick="addCustom('mode')">+ Mode</button>
                </div>
                <button onclick="resetCustoms()" style="background:#cf6679;margin-top:16px;width:100%;">Clear All Options</button>
            </div>
            <div class="counts" id="optionCounts"></div>
        </div>

        <div class="card">
            <h2>Add Match</h2>
            <div class="form-grid">
                <input type="date" id="date">
                <input type="time" id="time">
                <input type="text" id="weapon" placeholder="Primary Weapon" list="weaponList">
                <input type="number" id="kills" placeholder="Eliminations" min="0">
                <input type="number" id="deaths" placeholder="Deaths" min="0">
                <input type="number" id="score" placeholder="Score" min="0">
                <select id="map"><option value="">Select Map</option></select>
                <select id="mode"><option value="">Select Mode</option></select>
            </div>

            <div class="quick-buttons">
                <button onclick="setResult(1)">Win</button>
                <button onclick="setResult(0)">Loss</button>
            </div>

            <button onclick="addMatch()" style="width:100%;">Add Match</button>
        </div>

        <div class="card">
            <h2>Lifetime Summary</h2>
            <div class="summary" id="lifetimeSummary"></div>
        </div>
    </div>

    <div id="matches" class="tab-content">
        <div class="card">
            <h2>Recent Matches</h2>
            <table id="matchesTable">
                <thead>
                    <tr>
                        <th>Date</th><th>Time</th><th>Mode</th><th>Map</th><th>Weapon</th><th>K/D</th><th>Score</th><th>Result</th><th></th>
                    </tr>
                </thead>
                <tbody></tbody>
            </table>
        </div>

        <div class="card">
            <h2>Daily Summary</h2>
            <table id="dailyTable">
                <thead>
                    <tr>
                        <th>Date</th><th>Matches</th><th>Win %</th><th>Net W/L</th><th>Net Elims</th><th>Avg K/D</th><th>Avg Score</th>
                    </tr>
                </thead>
                <tbody></tbody>
            </table>
        </div>
    </div>

    <div id="charts" class="tab-content">
        <div class="card">
            <h2>Lifetime K/D Trend</h2>
            <canvas id="kdChart"></canvas>
        </div>
        <div class="card">
            <h2>Win Rate & Avg Score (10-match rolling)</h2>
            <canvas id="winScoreChart"></canvas>
        </div>
        <div class="card">
            <h2>Last 30 Matches Stats</h2>
            <div class="summary" id="last30Summary"></div>
        </div>
    </div>

    <datalist id="weaponList"></datalist>

    <script>
        let matches = JSON.parse(localStorage.getItem('bo7matches') || '[]');

        let full = {
            weapons: [],
            maps: [],
            modes: []
        };

        const saved = localStorage.getItem('bo7full');
        if (saved) {
            try {
                full = JSON.parse(saved);
            } catch (e) {
                full = {weapons: [], maps: [], modes: []};
            }
        }

        let currentResult = 1;
        let kdChart = null;
        let winScoreChart = null;

        const now = new Date();
        document.getElementById('date').value = now.toISOString().slice(0,10);
        document.getElementById('time').value = now.toTimeString().slice(0,5);

        function openTab(name) {
            document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(name).classList.add('active');
            event.target.classList.add('active');
            if (name === 'charts') renderCharts();
        }

        function setResult(w) {
            currentResult = w;
            document.querySelectorAll('.quick-buttons button').forEach(b => b.style.background = '#333');
            event.target.style.background = '#bb86fc';
        }

        function addCustom(type) {
            const inputId = 'new' + type.charAt(0).toUpperCase() + type.slice(1);
            const input = document.getElementById(inputId);
            let value = input.value.trim();
            if (!value) return;

            value = value.charAt(0).toUpperCase() + value.slice(1).toLowerCase();

            const list = full[type + 's'];
            if (list.includes(value)) {
                alert(value + ' is already added!');
                input.value = '';
                return;
            }

            list.push(value);
            localStorage.setItem('bo7full', JSON.stringify(full));
            populateDropdowns();
            input.value = '';
        }

        function resetCustoms() {
            if (confirm('Clear all weapons, maps, and modes?')) {
                full = {weapons: [], maps: [], modes: []};
                localStorage.setItem('bo7full', JSON.stringify(full));
                populateDropdowns();
            }
        }

        function populateDropdowns() {
            document.getElementById('weaponList').innerHTML = full.weapons.map(w => `<option value="${w}">`).join('');
            document.getElementById('map').innerHTML = '<option value="">Select Map</option>' + full.maps.sort().map(m => `<option value="\( {m}"> \){m}</option>`).join('');
            document.getElementById('mode').innerHTML = '<option value="">Select Mode</option>' + full.modes.sort().map(m => `<option value="\( {m}"> \){m}</option>`).join('');
            document.getElementById('optionCounts').innerHTML = `Weapons: ${full.weapons.length} | Maps: ${full.maps.length} | Modes: ${full.modes.length}`;
        }

        function addMatch() {
            const match = {
                date: document.getElementById('date').value || now.toISOString().slice(0,10),
                time: document.getElementById('time').value || now.toTimeString().slice(0,5),
                weapon: document.getElementById('weapon').value.trim() || "—",
                kills: parseInt(document.getElementById('kills').value) || 0,
                deaths: parseInt(document.getElementById('deaths').value) || 0,
                score: parseInt(document.getElementById('score').value) || 0,
                map: document.getElementById('map').value || "—",
                mode: document.getElementById('mode').value || "—",
                result: currentResult
            };
            matches.push(match);
            localStorage.setItem('bo7matches', JSON.stringify(matches));
            document.getElementById('kills').value = '';
            document.getElementById('deaths').value = '';
            document.getElementById('score').value = '';
            document.getElementById('weapon').value = '';
            setResult(1);
            renderAll();
        }

        function deleteMatch(i) {
            matches.splice(i,1);
            localStorage.setItem('bo7matches', JSON.stringify(matches));
            renderAll();
        }

        function renderSummary() {
            const t = matches.reduce((a,m)=>({matches:a.matches+1,wins:a.wins+m.result,kills:a.kills+m.kills,deaths:a.deaths+m.deaths,score:a.score+m.score}),{matches:0,wins:0,kills:0,deaths:0,score:0});
            const kd = t.deaths===0 ? t.kills : (t.kills/t.deaths).toFixed(2);
            const wr = t.matches ? (t.wins/t.matches*100).toFixed(1) : 0;
            const as = t.matches ? Math.round(t.score/t.matches) : 0;
            document.getElementById('lifetimeSummary').innerHTML = `
                <div class="stat-box"><div class="stat-value">${t.matches}</div><div class="stat-label">Matches</div></div>
                <div class="stat-box"><div class="stat-value">${wr}%</div><div class="stat-label">Win Rate</div></div>
                <div class="stat-box"><div class="stat-value">${kd}</div><div class="stat-label">K/D</div></div>
                <div class="stat-box"><div class="stat-value" style="color:\( {t.kills-t.deaths>=0?'#03dac6':'#cf6679'}"> \){t.kills-t.deaths>=0?'+' : ''}${t.kills-t.deaths}</div><div class="stat-label">Net Elims</div></div>
                <div class="stat-box"><div class="stat-value">${as.toLocaleString()}</div><div class="stat-label">Avg Score</div></div>
            `;
        }

        function renderMatchesAndDaily() {
            const s = [...matches].reverse();
            document.querySelector('#matchesTable tbody').innerHTML = s.map((m,i)=>{
                const idx = matches.length - 1 - i;
                const kd = m.deaths === 0 ? m.kills : (m.kills / m.deaths).toFixed(2);
                return `<tr>
                    <td>${m.date}</td>
                    <td>${m.time}</td>
                    <td>${m.mode}</td>
                    <td>${m.map}</td>
                    <td>${m.weapon}</td>
                    <td>${kd}</td>
                    <td>${m.score.toLocaleString()}</td>
                    <td style="color:\( {m.result?'#03dac6':'#cf6679'}"> \){m.result?'Win':'Loss'}</td>
                    <td><button class="delete-btn" onclick="deleteMatch(${idx})">Delete</button></td>
                </tr>`;
            }).join('');

            const d = {};
            matches.forEach(m => {
                if (!d[m.date]) d[m.date] = {m:0,w:0,k:0,de:0,s:0};
                d[m.date].m++;
                d[m.date].w += m.result;
                d[m.date].k += m.kills;
                d[m.date].de += m.deaths;
                d[m.date].s += m.score;
            });

            document.querySelector('#dailyTable tbody').innerHTML = Object.keys(d).sort().reverse().map(date => {
                const x = d[date];
                return `<tr>
                    <td>${date}</td>
                    <td>${x.m}</td>
                    <td>${(x.w/x.m*100).toFixed(0)}%</td>
                    <td style="color:\( {x.w-(x.m-x.w)>=0?'#03dac6':'#cf6679'}"> \){x.w-(x.m-x.w)}</td>
                    <td>${x.k-x.de}</td>
                    <td>${x.de===0?x.k:(x.k/x.de).toFixed(2)}</td>
                    <td>${Math.round(x.s/x.m).toLocaleString()}</td>
                </tr>`;
            }).join('');
        }

        function renderLast30() {
            const l = matches.slice(-30);
            if (l.length === 0) {
                document.getElementById('last30Summary').innerHTML = '<p>No matches yet.</p>';
                return;
            }
            const t = l.reduce((a,m)=>({matches:a.matches+1,wins:a.wins+m.result,kills:a.kills+m.kills,deaths:a.deaths+m.deaths,score:a.score+m.score}),{matches:0,wins:0,kills:0,deaths:0,score:0});
            const kd = t.deaths===0 ? t.kills : (t.kills/t.deaths).toFixed(2);
            const wr = (t.wins/t.matches*100).toFixed(1);
            const as = Math.round(t.score/t.matches);
            document.getElementById('last30Summary').innerHTML = `
                <div class="stat-box"><div class="stat-value">${t.matches}</div><div class="stat-label">Last 30</div></div>
                <div class="stat-box"><div class="stat-value">${wr}%</div><div class="stat-label">Win Rate</div></div>
                <div class="stat-box"><div class="stat-value">${kd}</div><div class="stat-label">K/D</div></div>
                <div class="stat-box"><div class="stat-value" style="color:\( {t.kills-t.deaths>=0?'#03dac6':'#cf6679'}"> \){t.kills-t.deaths>=0?'+' : ''}${t.kills-t.deaths}</div><div class="stat-label">Net Elims</div></div>
                <div class="stat-box"><div class="stat-value">${as.toLocaleString()}</div><div class="stat-label">Avg Score</div></div>
            `;
        }

        function renderCharts() {
            const sorted = matches.slice().sort((a,b) => `${a.date} \( {a.time}`.localeCompare(` \){b.date} ${b.time}`));
            const labels = sorted.map((_,i) => `Match ${i+1}`);

            const kdData = [];
            let ck = 0, cd = 0;
            sorted.forEach(m => {
                ck += m.kills;
                cd += m.deaths;
                kdData.push(cd === 0 ? ck : (ck / cd).toFixed(2));
            });

            if (kdChart) kdChart.destroy();
            kdChart = new Chart(document.getElementById('kdChart'), {
                type: 'line',
                data: {
                    labels,
                    datasets: [{
                        label: 'Cumulative K/D',
                        data: kdData,
                        borderColor: '#bb86fc',
                        tension: 0.3,
                        fill: true
                    }]
                },
                options: { responsive: true }
            });

            const winRate = [], avgScore = [];
            const w = 10;
            for (let i = 0; i < sorted.length; i++) {
                const sl = sorted.slice(Math.max(0, i - w + 1), i + 1);
                winRate.push((sl.filter(m => m.result).length / sl.length * 100).toFixed(1));
                avgScore.push(Math.round(sl.reduce((s,m) => s + m.score, 0) / sl.length));
            }

            if (winScoreChart) winScoreChart.destroy();
            winScoreChart = new Chart(document.getElementById('winScoreChart'), {
                type: 'line',
                data: {
                    labels,
                    datasets: [
                        { label: 'Win Rate %', data: winRate, borderColor: '#03dac6', yAxisID: 'y1' },
                        { label: 'Avg Score', data: avgScore, borderColor: '#ff7597', yAxisID: 'y2' }
                    ]
                },
                options: {
                    responsive: true,
                    scales: {
                        y1: { position: 'left', min: 0, max: 100 },
                        y2: { position: 'right' }
                    }
                }
            });

            renderLast30();
        }

        function renderAll() {
            renderSummary();
            renderMatchesAndDaily();
            populateDropdowns();
            if (document.getElementById('charts').classList.contains('active')) renderCharts();
        }

        populateDropdowns();
        setResult(1);
        renderAll();

        // PWA: Register service worker
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js')
                    .then(reg => console.log('Service worker registered'))
                    .catch(err => console.log('Service worker error: ', err));
            });
        }
    </script>
</body>
</html>
